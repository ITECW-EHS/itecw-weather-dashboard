<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ITE College West Operations Dashboard</title>

<style>

body {
    margin: 0;
    padding: 20px;
    background: #081633;
    color: white;
    font-family: Segoe UI, Arial, sans-serif;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#banner {
    margin: 20px 0;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 15px;
}

.card {
    background: #22345f;
    border-radius: 12px;
    padding: 20px;
}

.value {
    font-size: 42px;
    font-weight: bold;
}

.status {
    margin-top: 10px;
    font-weight: bold;
}

.small {
    margin-top: 8px;
    font-size: 12px;
    opacity: .8;
}

</style>

</head>

<body>

<div class="header">
    <h1>ITE College West Operations Dashboard</h1>
    <div id="clock"></div>
</div>

<div id="banner">
Loading...
</div>

<div class="grid">

    <div class="card">

        <h3>WBGT</h3>

        <div id="wbgt" class="value">
            Loading...
        </div>

        <div id="wbgtStatus" class="status">
            Loading...
        </div>

        <div id="wbgtUpdate" class="small">
            -
        </div>

    </div>

    <div class="card">

        <h3>Lightning</h3>

        <div id="lightning" class="value">
            Loading...
        </div>

    </div>

    <div class="card">

        <h3>PSI</h3>

        <div id="psi" class="value">
            Loading...
        </div>

    </div>

    <div class="card">

        <h3>2-Hour Forecast</h3>

        <div id="forecast">
            Loading...
        </div>

    </div>

    <div class="card">

        <h3>Outdoor Work Recommendation</h3>

        <div id="recommendation">
            Loading...
        </div>

    </div>

</div>

<br>

Last Updated:
<span id="lastUpdated">-</span>

<script>

let currentWBGT = 0;
let currentPSI = 0;
let lightningCount = 0;
let currentForecast = "";

/* CLOCK */

function updateClock(){

    const now = new Date();

    document.getElementById("clock")
        .innerText = now.toLocaleString();

    document.getElementById("lastUpdated")
        .innerText = now.toLocaleString();
}

/* WBGT */

async function getWBGT(){

    try{

        const response =
        await fetch(
        "https://api-open.data.gov.sg/v2/real-time/api/weather?api=wbgt"
        );

        const data =
        await response.json();

        const reading =
        data.data.records[0]
        .item.readings[0];

        currentWBGT =
        Number(reading.wbgt);

        const heatStress =
        reading.heatStress;

        document.getElementById("wbgt")
            .innerText =
            currentWBGT.toFixed(1) + "°C";

        document.getElementById("wbgtStatus")
            .innerText =
            heatStress.toUpperCase();

        document.getElementById("wbgtUpdate")
            .innerText =
            "Updated: " +
            new Date().toLocaleTimeString();

        if(heatStress === "High"){

            document.getElementById("wbgtStatus")
                .style.color = "#ef4444";

        } else if(heatStress === "Moderate"){

            document.getElementById("wbgtStatus")
                .style.color = "#f59e0b";

        } else {

            document.getElementById("wbgtStatus")
                .style.color = "#22c55e";

        }

    }
    catch(error){

        console.error(error);

    }

}

/* LIGHTNING */

async function getLightning(){

    try{

        const response =
        await fetch(
        "https://api-open.data.gov.sg/v2/real-time/api/weather?api=lightning"
        );

        const data =
        await response.json();

        lightningCount =
        data.data.records[0]
        .item.readings.length;

        document.getElementById("lightning")
            .innerText =
            lightningCount;

    }
    catch(error){

        console.error(error);

    }

}

/* PSI */

async function getPSI(){

    try{

        const response =
        await fetch(
        "https://api-open.data.gov.sg/v2/real-time/api/psi"
        );

        const data =
        await response.json();

        currentPSI =
        data.data.items[0]
        .readings
        .psi_twenty_four_hourly
        .national;

        document.getElementById("psi")
            .innerText =
            currentPSI;

    }
    catch(error){

        console.error(error);

    }

}

/* FORECAST */

async function getForecast(){

    try{

        const response =
        await fetch(
        "https://api-open.data.gov.sg/v2/real-time/api/two-hr-forecast"
        );

        const data =
        await response.json();

        const forecasts =
        data.data.records[0]
        .forecasts;

        const cck =
        forecasts.find(
            x => x.area === "Choa Chu Kang"
        );

        if(cck){

            currentForecast =
            cck.forecast;

            document.getElementById("forecast")
                .innerText =
                currentForecast;
        }

    }
    catch(error){

        console.error(error);

    }

}
