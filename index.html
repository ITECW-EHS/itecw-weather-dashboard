<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ITE CW Operations Dashboard</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:Segoe UI, Arial, sans-serif;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

#banner{
    background:#22c55e;
    color:black;
    padding:20px;
    border-radius:12px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

.card h3{
    margin-top:0;
}

.value{
    font-size:32px;
    font-weight:bold;
}

.footer{
    margin-top:20px;
}

</style>

</head>

<body>

<div class="header">
    <h1>ITE College West Operations Dashboard</h1>
    <div id="clock"></div>
</div>

<div id="banner">
🟢 SAFE TO PROCEED
</div>

<div class="grid">

<div class="card">
    <h3>WBGT</h3>
    <div id="wbgt" class="value">29.5°C</div>
</div>

<div class="card">
    <h3>Lightning</h3>
    <div id="lightning" class="value">0</div>
</div>

<div class="card">
    <h3>PSI</h3>
    <div id="psi" class="value">42</div>
</div>

<div class="card">
    <h3>2-Hour Forecast</h3>
    <div id="forecast">Partly Cloudy</div>
</div>

<div class="card">
    <h3>Outdoor Work Recommendation</h3>
    <div id="recommendation">
        ✓ Outdoor work may proceed<br>
        ✓ Continue monitoring<br>
        ✓ Maintain hydration
    </div>
</div>

<div class="card">
    <h3>Campus Advisory</h3>
    <div id="advisory">
        Normal Operations
    </div>
</div>

</div>

<div class="footer">
    Last Updated:
    <span id="lastUpdated"></span>
</div>

<script>

let currentWBGT = 0;
let lightningCount = 0;
let currentForecast = "";

/* CLOCK */

function updateTime(){

    const now = new Date();

    document.getElementById("clock").innerText =
    now.toLocaleString();

    document.getElementById("lastUpdated").innerText =
    now.toLocaleString();
}


/* WBGT */

async function getWBGT(){

    try{

        const response =
        await fetch(
        "https://api-open.data.gov.sg/v2/real-time/api/weather?api=wbgt"
        );

        const data =
        await response.json();

        currentWBGT =
        Number(
        data.data.records[0]
        .item.readings[0]
        .wbgt
        );

        document.getElementById("wbgt")
        .innerText =
        currentWBGT.toFixed(1)
        + "°C";

    }

    catch(error){

        console.error(error);

        document.getElementById("wbgt")
        .innerText =
        "N/A";

    }

}


/* LIGHTNING */

async function getLightning(){

    try{

        const response =
        await fetch(
        "https://api-open.data.gov.sg/v2/real-time/api/weather?api=lightning"
        );

        const data =
        await response.json();

        lightningCount =
        data.data.records[0]
        .item.readings.length;

        document.getElementById("lightning")
        .innerText =
        lightningCount;

    }

    catch(error){

        console.error(error);

        document.getElementById("lightning")
        .innerText =
        "N/A";

    }

}


/* FORECAST */

async function getForecast(){

    try{

        const response =
        await fetch(
        "https://api-open.data.gov.sg/v2/real-time/api/two-hr-forecast"
        );

        const data =
        await response.json();

        const forecasts =
        data.data.records[0]
        .forecasts;

        const cck =
        forecasts.find(
        x => x.area ===
        "Choa Chu Kang"
        );

        if(cck){

            currentForecast =
            cck.forecast;

            document
            .getElementById("forecast")
            .innerText =
            currentForecast;
        }

    }

    catch(error){

        console.error(error);

        document.getElementById("forecast")
        .innerText =
        "N/A";

    }

}


/* RAG STATUS */

function updateSafetyStatus(){

    const banner =
    document.getElementById(
    "banner"
    );

    const recommendation =
    document.getElementById(
    "recommendation"
    );

    if(lightningCount > 0){

        banner.innerHTML =
        "🔴 REVIEW OR SUSPEND OUTDOOR WORK";

        banner.style.background =
        "#ffdddd";

        banner.style.color =
        "#000";

        recommendation.innerHTML =
        `
        ⚠ Lightning Activity Detected<br>
        ⚠ Stop Roof Work<br>
        ⚠ Stop Ladder Work<br>
        ⚠ Seek Shelter
        `;
    }

    else if(currentWBGT >= 32){

        banner.innerHTML =
        "🔴 HIGH HEAT STRESS";

        banner.style.background =
        "#ffdddd";

        banner.style.color =
        "#000";

        recommendation.innerHTML =
        `
        ⚠ Increase Hydration<br>
        ⚠ Rest Breaks Required<br>
        ⚠ Review Outdoor Activities
        `;
    }

    else if(
        currentWBGT >= 31 ||

        currentForecast.toLowerCase()
        .includes("shower") ||

        currentForecast.toLowerCase()
        .includes("thunder")
    ){

        banner.innerHTML =
        "🟠 PROCEED WITH CONTROLS";

        banner.style.background =
        "#fff2cc";

        banner.style.color =
        "#000";

        recommendation.innerHTML =
        `
        • Monitor Weather Conditions<br>
        • Increase Hydration<br>
        • Prepare Shelter
        `;
    }

    else{

        banner.innerHTML =
        "🟢 SAFE TO PROCEED";

        banner.style.background =
        "#22c55e";

        banner.style.color =
        "#000";

        recommendation.innerHTML =
        `
        ✓ Outdoor Work May Proceed<br>
        ✓ Continue Monitoring<br>
        ✓ Maintain Hydration
        `;
    }

}


/* MAIN REFRESH */

async function refreshDashboard(){

    await Promise.all([

        getWBGT(),
        getLightning(),
        getForecast()

    ]);

    updateSafetyStatus();

    updateTime();

}


/* START */

refreshDashboard();

setInterval(
refreshDashboard,
120000
);

setInterval(
updateTime,
1000
);

</script>
