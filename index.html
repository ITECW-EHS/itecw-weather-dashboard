<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ITE CW Operations Dashboard</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#0b1635;
    color:white;
    font-family:'Segoe UI',sans-serif;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:#1e2d4d;
    border-radius:12px;
    padding:20px;
}

.card h3{
    margin-top:0;
}

.value{
    font-size:42px;
    font-weight:bold;
}

#banner{
    margin-bottom:20px;
    padding:20px;
    text-align:center;
    border-radius:12px;
    font-size:32px;
    font-weight:bold;
}

.footer{
    margin-top:20px;
}

</style>

</head>

<body>

<h1>
ITE College West

</h1>

</div>

<div id="banner">

<h3>2-Hour Forecast</h3>

<div id="forecast">

Loading...

<div class="card">

<h3>
Outdoor Work
Recommendation
</h3>

<div id="recommendation">

Loading...

</div>

</div>

<h3>
Campus Advisory

Normal Operations

</div>

</div>

<div class="footer">

Last Updated:

<span id="lastUpdated"></span>

</div>

<script>

let currentWBGT = 0;
let lightningCount = 0;
let currentPSI = 0;
let currentForecast = "";

/* CLOCK */

function updateTime(){

    const now =
    new Date();

    document.getElementById(
    "clock"
    ).innerText =
    now.toLocaleString();

    document.getElementById(
    "lastUpdated"
    ).innerText =
    now.toLocaleString();
}

/* WBGT */

async function getWBGT(){

    try{

        const response =
        await fetch(
        "https://api-open.data.gov.sg/v2/real-time/api/weather?api=wbgt"
        );

        const data =
        await response.json();

        currentWBGT =
        Number(
        data.data.records[0]
        .item.readings[0]
        .wbgt
        );

        document.getElementById(
        "wbgt"
        ).innerText =
        currentWBGT.toFixed(1)
        + "°C";

    }

    catch(error){

        console.error(error);

        document.getElementById(
        "wbgt"
        ).innerText =
        "N/A";

    }

}

/* LIGHTNING */

async function getLightning(){

    try{

        const response =
        await fetch(
        "https://api-open.data.gov.sg/v2/real-time/api/weather?api=lightning"
        );

        const data =
        await response.json();

        lightningCount =
        data.data.records[0]
        .item.readings.length;

        document.getElementById(
        "lightning"
        ).innerText =
        lightningCount;

    }

    catch(error){

        console.error(error);

        document.getElementById(
        "lightning"
        ).innerText =
        "N/A";

    }

}

/* PSI */

async function getPSI(){

    try{

        const response =
        await fetch(
        "https://api-open.data.gov.sg/v2/real-time/api/psi"
        );

        const data =
        await response.json();

        currentPSI =
        data.data.items[0]
        .readings
        .psi_twenty_four_hourly
        .national;

        document.getElementById(
        "psi"
        ).innerText =
        currentPSI;

    }

    catch(error){

        console.error(error);

        document.getElementById(
        "psi"
        ).innerText =
        "N/A";

    }

}
