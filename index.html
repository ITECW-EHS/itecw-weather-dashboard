<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ITE CW Operations Dashboard</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#081633;
    color:white;
    font-family:Segoe UI, Arial, sans-serif;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#banner{
    margin:20px 0;
    padding:20px;
    border-radius:12px;
    background:#22c55e;
    color:black;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:#1f2f50;
    border-radius:12px;
    padding:20px;
}

.value{
    font-size:42px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="header">
<h1>ITE College West Operations Dashboard</h1>
<div id="clock"></div>
</div>

<div id="banner">
🟢 SAFE TO PROCEED
</div>

<div class="grid">

<div class="card">
<h3>WBGT</h3>
<div id="wbgt" class="value">Loading...</div>
</div>

<div class="card">
<h3>Lightning</h3>
<div id="lightning" class="value">Loading...</div>
</div>

<div class="card">
<h3>PSI</h3>
<div id="psi" class="value">Loading...</div>
</div>

<div class="card">
<h3>Forecast</h3>
<div id="forecast">Loading...</div>
</div>

</div>

<br>

Last Updated:
<span id="lastUpdated"></span>

<script>

function updateClock(){

    const now = new Date();

    document.getElementById("clock").innerText =
        now.toLocaleString();

    document.getElementById("lastUpdated").innerText =
        now.toLocaleString();
}

async function testLoad(){

    document.getElementById("wbgt")
        .innerText = "28.4°C";

    document.getElementById("lightning")
        .innerText = "0";

    document.getElementById("psi")
        .innerText = "21";

    document.getElementById("forecast")
        .innerText = "Partly Cloudy";
}

document.addEventListener(
"DOMContentLoaded",
function(){

    updateClock();

    testLoad();

    setInterval(
        updateClock,
        1000
    );

});

</script>

</body>
</html>
